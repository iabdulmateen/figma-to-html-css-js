<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture Website</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
          <img src="./assets/images/logo.svg" alt="logo" />
          <span>Furniro</span>
        </div>

        <nav class="navbar-links">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>

        <div class="nav-icons">
          <img src="./assets/icons/account-icon.svg" alt="Account" />
          <img src="./assets/icons/search-icon.svg" alt="Search" />
          <img src="./assets/icons/heart-icon.svg" alt="Wishlist" />
          <img src="./assets/icons/cart-icon.svg" alt="Cart" />
        </div>
      </div>
    </header>
    <main>
      <!-- Hero Section -->
      <section class="hero-section">
        <div class="hero-container">
          <div class="hero-card" id="hero-card-target">
            <!-- Content render via JavaScript -->
          </div>
        </div>
      </section>
      <!-- Browse The Range Section -->
      <section class="range-section">
        <div class="range-container">
          <div class="range-header">
            <h2 class="range-title">Browse The Range</h2>
            <p class="range-subtitle">
              Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>
          </div>

          <div class="range-grid" id="range-grid-target">
            <!-- Dynamic Category Cards via JS -->
          </div>
        </div>
      </section>
      <!-- Our Products Section -->
      <section class="products-section">
        <div class="products-container">
          <h2 class="products-title">Our Products</h2>

          <div class="products-grid" id="products-grid-target">
            <!-- Dynamic Products Rendered via JS -->
          </div>

          <div class="more-btn-wrapper">
            <button class="show-more-btn">Show More</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
